name: ai-data-quality-power-platform

x-power-platform-environment: &power-platform-environment
  APP_ENV: ${APP_ENV:-development}
  DATASET_KEY: ${DATASET_KEY:-ecommerce-v1}
  DATA_SOURCE_PROVIDER: ${DATA_SOURCE_PROVIDER:-sharepoint}
  LOCAL_DATASET_PATH: /app/sample-data/ecommerce-v1
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  SHAREPOINT_HOST: ${SHAREPOINT_HOST:-}
  SHAREPOINT_SITE_PATH: ${SHAREPOINT_SITE_PATH:-/sites/AIDataQualityDev}
  SHAREPOINT_LIBRARY: ${SHAREPOINT_LIBRARY:-DataQualityDatasets}
  SHAREPOINT_DATASET_FOLDER: ${SHAREPOINT_DATASET_FOLDER:-GenericDatasets/ecommerce-v1}
  SHAREPOINT_BRONZE_LIBRARY: ${SHAREPOINT_BRONZE_LIBRARY:-DataQualityBronze}
  SHAREPOINT_BRONZE_PREFIX: ${SHAREPOINT_BRONZE_PREFIX:-GenericDatasets}
  SOURCE_MAX_FILES: ${SOURCE_MAX_FILES:-100}
  SOURCE_MAX_FILE_BYTES: ${SOURCE_MAX_FILE_BYTES:-26214400}
  SOURCE_MAX_ROWS: ${SOURCE_MAX_ROWS:-5000}
  MAXIMUM_EVIDENCE_ROWS: ${MAXIMUM_EVIDENCE_ROWS:-100}
  DATAVERSE_URL: ${DATAVERSE_URL:-}
  DATAVERSE_API_VERSION: ${DATAVERSE_API_VERSION:-v9.2}

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *power-platform-environment
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  power-app:
    build:
      context: ./apps/power-app
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "4173:4173"
